<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 606 200" width="1600" height="528" role="img" aria-label="ArTA accredited translator — Arab Translators Association">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#173563"/>
      <stop offset="100%" stop-color="#0b1d38"/>
    </linearGradient>
    <radialGradient id="gold" gradientUnits="userSpaceOnUse" cx="80" cy="60" r="150">
      <stop offset="0%" stop-color="#fff2a8"/>
      <stop offset="45%" stop-color="#f0bf33"/>
      <stop offset="100%" stop-color="#b07d0a"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe680"/>
      <stop offset="100%" stop-color="#e3a823"/>
    </linearGradient>
    <radialGradient id="navy" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#22406b"/>
      <stop offset="100%" stop-color="#0b1d38"/>
    </radialGradient>
  </defs>

  <!-- Badge background -->
  <rect x="0" y="0" width="606" height="200" rx="10" fill="url(#bg)"/>

  <!-- Seal (same design as the ArTA accredited seal), left -->
  <g transform="translate(12 12) scale(0.88)">
    <g fill="url(#gold)" stroke="#a5760c" stroke-width="1">
      <circle cx="100" cy="100" r="80"/>
      <circle cx="100.0" cy="16.0" r="13"/><circle cx="128.7" cy="21.1" r="13"/><circle cx="154.0" cy="35.7" r="13"/>
      <circle cx="172.7" cy="58.0" r="13"/><circle cx="182.7" cy="85.4" r="13"/><circle cx="182.7" cy="114.6" r="13"/>
      <circle cx="172.7" cy="142.0" r="13"/><circle cx="154.0" cy="164.3" r="13"/><circle cx="128.7" cy="178.9" r="13"/>
      <circle cx="100.0" cy="184.0" r="13"/><circle cx="71.3" cy="178.9" r="13"/><circle cx="46.0" cy="164.3" r="13"/>
      <circle cx="27.3" cy="142.0" r="13"/><circle cx="17.3" cy="114.6" r="13"/><circle cx="17.3" cy="85.4" r="13"/>
      <circle cx="27.3" cy="58.0" r="13"/><circle cx="46.0" cy="35.7" r="13"/><circle cx="71.3" cy="21.1" r="13"/>
    </g>
    <circle cx="100" cy="100" r="79" fill="url(#gold)"/>
    <circle cx="100" cy="100" r="64" fill="#c4931a"/>
    <circle cx="100" cy="100" r="60" fill="url(#navy)"/>
    <text x="100" y="99" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="38" fill="#ffffff" letter-spacing="1">ArTA</text>
    <text x="100" y="126" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700" font-size="19" fill="url(#goldText)">accredited</text>
  </g>

  <!-- Divider -->
  <rect x="200" y="28" width="2" height="144" fill="#c4931a" opacity="0.8"/>

  <!-- Text, right -->
  <text x="222" y="60" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="25" letter-spacing="2.5" fill="url(#goldText)">ACCREDITED</text>
  <text x="222" y="91" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="25" letter-spacing="2.5" fill="url(#goldText)">TRANSLATOR</text>
  <text x="222" y="129" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ffffff">Arab Translators Association</text>
  <text x="222" y="166" font-family="Tahoma, 'Segoe UI', Arial, sans-serif" font-size="25" fill="#dbe6f5" direction="rtl" text-anchor="end">جمعية المترجمين العرب</text>
</svg>
